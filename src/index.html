<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Share and discover amazing places through photos on Spots - a social media platform for location-based photo sharing."
    />
    <meta
      name="keywords"
      content="photo sharing, social media, locations, spots, photography, travel photos"
    />
    <title>Spots</title>
  </head>
  <body>
    <div class="page">
      <header class="header">
        <img src="" alt="Spot Logo" class="header__logo" />
      </header>
      <main class="content">
        <section class="profile page__section">
          <div class="profile__avatar-container">
            <button class="profile__avatar-btn" type="button">
              <img
                src="./images/pencil-light.svg"
                alt="Pencil Icon"
                class="profile__pencil-icon"
              />
            </button>
            <img src="" alt="Bessie Coleman" class="profile__avatar" />
          </div>
          <div class="profile__column">
            <h1 class="profile__name">Bessie Coleman</h1>
            <p class="profile__description">Civil Aviator</p>
            <button class="profile__edit-btn" type="button">
              <img src="" alt="Edit Profile" class="profile__edit-icon" />
              Edit Profile
            </button>
          </div>
          <button class="profile__add-btn" type="button">
            <img src="" alt="plus icon" class="new-icon" />
            New Post
          </button>
        </section>
        <section class="cards page__section">
          <ul class="cards__list">
            <template id="card-template">
              <li class="card">
                <button class="card__delete-btn" type="button"></button>
                <img src="" alt="" class="card__image" />
                <div class="card__content">
                  <h2 class="card__title"></h2>
                  <button class="card__like-btn" type="button"></button>
                </div>
              </li>
            </template>
          </ul>
        </section>
      </main>
      <footer class="footer">
        <p class="footer__copyright">2023 © Spots</p>
      </footer>
      <div class="modal" id="edit-profile-modal">
        <div class="modal__container">
          <button class="modal__close-btn" type="button">
            <img src="" alt="Close modal" class="modal__close-icon" />
          </button>
          <h2 class="modal__title">Edit Profile</h2>
          <form class="modal__form">
            <label class="modal__label" for="profile-name-input"
              >Name<input
                type="text"
                id="profile-name-input"
                class="modal__input"
                maxlength="40"
                minlength="2"
                placeholder="Type your name"
                required
              />
              <span
                id="profile-name-input-error"
                class="modal__error_visible"
              ></span>
            </label>
            <label class="modal__label" for="profile-description-input"
              >Description<input
                type="text"
                id="profile-description-input"
                class="modal__input"
                placeholder="Describe yourself"
                maxlength="200"
                minlength="2"
                required
              />
              <span
                id="profile-description-input-error"
                class="modal__error_visible"
              ></span>
            </label>

            <button class="modal__button" type="submit">Save</button>
          </form>
        </div>
      </div>
      <div class="modal" id="new-post-modal">
        <div class="modal__container">
          <button class="modal__close-btn" type="button">
            <img src="" alt="Close modal" class="modal__close-icon" />
          </button>
          <h2 class="modal__title">New post</h2>
          <form class="modal__form">
            <label class="modal__label" for="card-image-input"
              >Image link<input
                type="url"
                id="card-image-input"
                class="modal__input"
                placeholder="Paste a link to the picture"
                required
              />
              <span
                id="card-image-input-error"
                class="modal__error modal__error_visible"
              ></span>
            </label>
            <label class="modal__label" for="card-caption-input"
              >Caption<input
                type="text"
                id="card-caption-input"
                class="modal__input"
                placeholder="Type your caption"
                maxlength="30"
                minlength="2"
                required
              />
              <span
                id="card-caption-input-error"
                class="modal__error modal__error_visible"
              ></span>
            </label>

            <button class="modal__button" type="submit">Save</button>
          </form>
        </div>
      </div>

      <div class="modal modal_type_preview" id="preview-modal">
        <div class="modal__image-container">
          <button
            class="modal__close-btn modal__close-btn_type_preview"
            type="button"
            aria-label="Close"
          ></button>
          <img src="" alt="" class="modal__preview-image" />
          <p class="modal__caption"></p>
        </div>
      </div>
    </div>
    <div class="modal" id="avatar-modal">
      <div class="modal__container">
        <button class="modal__close-btn" type="button">
          <img src="" alt="Close modal" class="modal__close-icon" />
        </button>
        <h2 class="modal__title">Edit Avatar</h2>
        <form class="modal__form">
          <label class="modal__label" for="avatar-input"
            >Avatar<input
              type="url"
              id="avatar-input"
              name="avatar"
              class="modal__input"
              placeholder="Paste a link to the picture"
              required
            />
            <span
              id="avatar-input-error"
              class="modal__error modal__error_visible"
            ></span>
          </label>

          <button class="modal__button" type="submit">Save</button>
        </form>
      </div>
    </div>
    <div class="modal modal_type_delete" id="delete-modal">
      <div class="modal__container">
        <button
          class="modal__close-btn modal__close-btn_type_delete"
          type="button"
          aria-label="Close"
        ></button>
        <h2 class="modal__title">
          Are you sure you want to delete this image?
        </h2>
        <form class="modal__form">
          <div class="modal__button-group">
            <button class="modal__button modal__button-delete" type="submit">
              Delete
            </button>
            <button class="modal__button modal__button-cancel" type="button">
              Cancel
            </button>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
